name: Build & Push Docker Image (develop)

on:
  push:
    branches:
      - develop
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ github.repository }}   # z.B. meinuser/mein-repo

jobs:
  build-and-push:
    name: Build & Push to GHCR + Docker Hub
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'

    permissions:
      contents: read
      packages: write   # Für GitHub Container Registry nötig

    steps:
      # ── 1. Code auschecken ────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Docker Buildx einrichten (für Multi-Platform / Cache) ──────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 3. Bei GitHub Container Registry einloggen ────────────────────
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # Automatisch vorhanden, kein Secret nötig

      # ── 4. Bei Docker Hub einloggen ───────────────────────────────────
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── 5. Image-Tags & Labels generieren ─────────────────────────────
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ env.IMAGE_NAME }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}
          tags: |
            type=raw,value=develop
            type=sha,prefix=develop-,format=short   # z.B. develop-a1b2c3d (optional, aber nützlich)

      # ── 6. Image bauen & pushen ───────────────────────────────────────
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha          # GitHub Actions Cache nutzen
          cache-to: type=gha,mode=max   # Build-Cache speichern → schnellere Folge-Builds