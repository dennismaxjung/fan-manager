name: Build & Push Docker Image (develop)

on:
  push:
    branches:
      - develop
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ github.repository }}   # e.g. myuser/my-repo

jobs:
  build-and-push:
    name: Build & Push to GHCR + Docker Hub
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'

    permissions:
      contents: read
      packages: write   # Required for GitHub Container Registry

    steps:
      # ── 1. Check out code ─────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Docker Buildx (for multi-platform / cache) ──────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 3. Log in to GitHub Container Registry ────────────────────────
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # Provided automatically, no secret needed

      # ── 4. Log in to Docker Hub ───────────────────────────────────────
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── 5. Generate image tags & labels ───────────────────────────────
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ env.IMAGE_NAME }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}
          tags: |
            type=raw,value=develop
            type=sha,prefix=develop-,format=short   # e.g. develop-a1b2c3d (optional but useful)

      # ── 6. Build & push image ─────────────────────────────────────────
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha          # Use GitHub Actions cache
          cache-to: type=gha,mode=max   # Store build cache → faster subsequent builds